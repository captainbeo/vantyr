# Vantyr API — local development / staging deployment.
#
# Pinned build: the gateway image is built from the pinned source in this
# repository (upstream New API tag v1.0.0-rc.41, commit 2035a82a). Never use
# the public `calciumion/new-api:latest` image.
#
# Secrets: keep real values in an untracked .env file next to this compose
# file (see .env.example). Do not commit real secrets.

name: vantyr

services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: vantyr/new-api:cache-affinity-20261026
    container_name: vantyr-gateway
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      # Loopback only: Caddy (the TLS entrypoint) proxies to the gateway;
      # a 0.0.0.0 publish would bypass the firewall via Docker's iptables rules.
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-vantyr}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-vantyr}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?set in .env}@redis:6379
      - NODE_NAME=vantyr-gateway-1
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - TZ=${TZ:-UTC}
      # Idle-stream timeout (seconds): fires only after N seconds with
      # ZERO bytes; resets on every chunk, so long reasoning streams are
      # unaffected. Default 300 was letting a silent upstream hold a client
      # for 5 minutes (kiro-pool 2026-10-24).
      - STREAMING_TIMEOUT=${STREAMING_TIMEOUT:-60}
    volumes:
      - ./data/logs:/app/logs
      - ./data/gateway:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vantyr
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - vantyr
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vantyr}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-vantyr}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - vantyr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantyr} -d ${POSTGRES_DB:-vantyr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GM Pay (epusdt) — self-hosted crypto top-up gateway (Epay-compatible).
  # Pinned image; config + SQLite live under ./data/gmpay (bind-mounted /data).
  gmpay:
    image: gmwallet/epusdt:v2.0.0
    container_name: vantyr-gmpay
    restart: unless-stopped
    environment:
      - EPUSDT_CONFIG=/data/.env
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./data/gmpay:/data
    networks:
      - vantyr

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/vantyr-static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - vantyr

  # cctest model-authenticity monitor — observe-only until CCTEST_ENFORCE=true
  # in .env. Quarantines a channel (status 2) on bad cctest verdicts; the
  # native test loop skips status-2 channels, so only this service re-enables
  # them. Needs CCTEST_* vars in .env or it parks (no restart storm).
  cctest-monitor:
    build:
      context: ./cctest-monitor
      dockerfile: Dockerfile
    image: vantyr/cctest-monitor:latest
    container_name: vantyr-cctest-monitor
    restart: unless-stopped
    environment:
      - GATEWAY_URL=http://gateway:3000
      - GATEWAY_TOKEN=${CCTEST_GATEWAY_TOKEN:-}
      - CCTEST_KEY=${CCTEST_KEY:-}
      - CCTEST_BASE=${CCTEST_BASE:-https://cctest.ai}
      - CCTEST_FULL_CHECK=${CCTEST_FULL_CHECK:-false}
      - SELLER_CHANNELS=${CCTEST_SELLER_CHANNELS:-}
      - SELLER_MODEL_FILTERS=${CCTEST_SELLER_MODEL_FILTERS:-}
      - STANDBY_COOLDOWN_HOURS=${CCTEST_STANDBY_COOLDOWN_HOURS:-3}
      - A6_MANAGE_TOKEN=${CCTEST_A6_MANAGE_TOKEN:-}
      - A6_MANAGE_USER=${CCTEST_A6_MANAGE_USER:-}
      - SICK_WINDOW_MINUTES=${CCTEST_SICK_WINDOW_MINUTES:-60}
      # Gateway availability watchdog (2026-10-26). Pages Discord when the
      # gateway has been unreachable for DOWN_AFTER seconds, and again on
      # recovery. This is the only alert path that does not need the gateway,
      # so it still speaks when every other loop in the monitor is failing.
      - GATEWAY_WATCHDOG_ENABLED=${CCTEST_GATEWAY_WATCHDOG_ENABLED:-true}
      - GATEWAY_WATCHDOG_INTERVAL=${CCTEST_GATEWAY_WATCHDOG_INTERVAL:-30}
      - GATEWAY_WATCHDOG_DOWN_AFTER=${CCTEST_GATEWAY_WATCHDOG_DOWN_AFTER:-120}
      # Quarantine re-check cadence (hours). Owner rule 2026-10-24.
      - QUARANTINE_RECHECK_HOURS=${CCTEST_QUARANTINE_RECHECK_HOURS:-2}
      - QUARANTINE_RECHECK_PERMANENT_HOURS=${CCTEST_QUARANTINE_RECHECK_PERMANENT_HOURS:-3}
      # Degraded-merchant auto-rotation (2026-10-24). Default off; arm by
      # setting CCTEST_LATENCY_ROTATION_ENABLED=true in .env then
      # `docker compose up -d cctest-monitor` (recreate — restart does NOT
      # re-read env).
      - LATENCY_ROTATION_ENABLED=${CCTEST_LATENCY_ROTATION_ENABLED:-false}
      - LATENCY_MIN_SAMPLES=${CCTEST_LATENCY_MIN_SAMPLES:-20}
      - LATENCY_FRT_MS_THRESHOLD=${CCTEST_LATENCY_FRT_MS_THRESHOLD:-10000}
      - LATENCY_CLIENT_GONE_RATIO=${CCTEST_LATENCY_CLIENT_GONE_RATIO:-0.20}
      - LATENCY_HANG_THRESHOLD=${CCTEST_LATENCY_HANG_THRESHOLD:-3}
      - LATENCY_ERROR_RATIO=${CCTEST_LATENCY_ERROR_RATIO:-0.05}
      # Primary-channel failover + severe-degradation circuit breaker
      # (2026-10-25). These were set directly on the server and never came
      # back to the repo; restored here so this file is the whole truth.
      # CCTEST_PRIMARY_CHANNELS names the primary per group, e.g.
      # "default:kiro-pool,unlimited:kiro-pool".
      - PRIMARY_CHANNELS=${CCTEST_PRIMARY_CHANNELS:-}
      - PRIMARY_RESTORE_MINUTES=${CCTEST_PRIMARY_RESTORE_MINUTES:-30}
      - PRIMARY_PROBE_BASE_URL=${CCTEST_PRIMARY_PROBE_BASE_URL:-}
      - PRIMARY_PROBE_KEY=${CCTEST_PRIMARY_PROBE_KEY:-}
      - PRIMARY_PROBE_MODEL=${CCTEST_PRIMARY_PROBE_MODEL:-claude-sonnet-5}
      - CIRCUIT_ERROR_RATIO=${CCTEST_CIRCUIT_ERROR_RATIO:-0.10}
      - CIRCUIT_BREAKER_ENABLED=${CCTEST_CIRCUIT_BREAKER_ENABLED:-true}
      - CIRCUIT_MIN_SAMPLES=${CCTEST_CIRCUIT_MIN_SAMPLES:-15}
      - CIRCUIT_CLIENT_GONE_RATIO=${CCTEST_CIRCUIT_CLIENT_GONE_RATIO:-0.50}
      - CIRCUIT_WINDOW_MINUTES=${CCTEST_CIRCUIT_WINDOW_MINUTES:-15}
      - CIRCUIT_INTERVAL_MINUTES=${CCTEST_CIRCUIT_INTERVAL_MINUTES:-5}
      - SYNC_INTERVAL_MINUTES=${CCTEST_SYNC_INTERVAL_MINUTES:-5}
      - MODEL_PREFIXES=${CCTEST_MODEL_PREFIXES:-claude,gpt}
      - USAGE_WINDOW_HOURS=${CCTEST_USAGE_WINDOW_HOURS:-168}
      - CYCLE_MINUTES=${CCTEST_CYCLE_MINUTES:-10}
      - ENFORCE=${CCTEST_ENFORCE:-false}
      - STATUS_PORT=${CCTEST_STATUS_PORT:-8787}
      - FAIL_THRESHOLD_SELORA=${CCTEST_FAIL_THRESHOLD_SELORA:-1}
      - FAIL_THRESHOLD_A6=${CCTEST_FAIL_THRESHOLD_A6:-2}
      - FAIL_THRESHOLD_MIA=${CCTEST_FAIL_THRESHOLD_MIA:-2}
      - FAIL_THRESHOLD_YINGZ=${CCTEST_FAIL_THRESHOLD_YINGZ:-2}
      - PERMANENT_FAILS=${CCTEST_PERMANENT_FAILS:-3}
      - DISCORD_WEBHOOK=${CCTEST_DISCORD_WEBHOOK:-}
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./data/cctest:/data
    networks:
      - vantyr

  # sub2api (Claude OAuth accounts → Anthropic-compatible API) is added at
  # Phase R2 once its image and credential handling are configured.

  # kiro-proxy — Kiro account pool → Anthropic/OpenAI-compatible API.
  # Sidecar that turns the operator's authorized Kiro accounts into the
  # Opus+Sonnet primary pool. Registered in the gateway as a channel; loopback
  # only (Caddy/gateway reach it over the vantyr network). Pinned image digest
  # below; see VANTYR.md for the upstream review note.
  kiro-proxy:
    image: ghcr.io/tanu360/kiro-reverse-api@sha256:68425f261983afa228db1a8f18a26ae5a83862636cbac24ed644e3cfd1c8505f
    container_name: vantyr-kiro-proxy
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/state
      - LOG_LEVEL=${KIRO_PROXY_LOG_LEVEL:-info}
      # Admin-panel password; strong random value from .env (never committed).
      - ADMIN_PASSWORD=${KIRO_PROXY_ADMIN_PASSWORD:?set KIRO_PROXY_ADMIN_PASSWORD in .env}
    ports:
      # Loopback only — admin panel + API must not be reachable off-host.
      - "127.0.0.1:${KIRO_PROXY_PORT:-8080}:8080"
    volumes:
      # kiro.db holds OAuth tokens + admin creds; private bind mount, never commit.
      - ./data/kiro-proxy:/app/state
    networks:
      - vantyr
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  vantyr:
    driver: bridge
