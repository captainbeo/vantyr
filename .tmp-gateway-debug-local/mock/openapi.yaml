openapi: 3.1.0
info:
  title: Commercial MVP mock transfer station
  version: 0.1.0
  description: >-
    Internal test-only contract for the two Compose mock transfer stations.
    These endpoints are not part of the customer API and must not be deployed
    as a public service.
servers:
  - url: http://mock:8080
    description: Compose-internal relay listener
tags:
  - name: readiness
  - name: relay-fixture
  - name: test-control
paths:
  /healthz:
    get:
      tags: [readiness]
      operationId: getMockHealth
      summary: Check process readiness without a response body
      security: []
      x-network-scope: compose-internal-only
      responses:
        "204":
          description: The mock process is ready
  /v1/responses:
    post:
      tags: [relay-fixture]
      operationId: createMockResponse
      summary: Return a deterministic JSON or SSE Responses fixture
      security:
        - relayBearer: []
      x-network-scope: compose-internal-only
      x-max-raw-body-bytes: 1048576
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              maxProperties: 128
              additionalProperties: true
      responses:
        "200":
          description: Deterministic completed response
          headers:
            X-Mock-Station-ID:
              $ref: "#/components/headers/MockStationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/MockSSETranscript"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "415":
          $ref: "#/components/responses/InvalidContentType"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
  /control/mode:
    servers:
      - url: http://mock:8081
        description: Test-control listener; host publication is loopback-only
    put:
      tags: [test-control]
      operationId: setMockMode
      summary: Select one allowlisted deterministic fixture mode
      security:
        - controlBearer: []
      x-network-scope: compose-internal-or-host-loopback-only
      x-rate-limit: local-test-operator-only
      x-max-raw-body-bytes: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [normal, unavailable]
      responses:
        "204":
          description: Mode changed
          headers:
            X-Mock-Station-ID:
              $ref: "#/components/headers/MockStationID"
        "400":
          $ref: "#/components/responses/InvalidControl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/InvalidContentType"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
  /control/attempts:
    servers:
      - url: http://mock:8081
        description: Test-control listener; host publication is loopback-only
    get:
      tags: [test-control]
      operationId: getMockAttempts
      summary: Read bounded non-secret relay attempt evidence
      security:
        - controlBearer: []
      x-network-scope: compose-internal-or-host-loopback-only
      responses:
        "200":
          description: Bounded attempt counters and last non-secret request metadata
          headers:
            X-Mock-Station-ID:
              $ref: "#/components/headers/MockStationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptCapture"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    relayBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-test-token
      description: A per-station relay credential supplied through a Compose deployment secret.
    controlBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-test-token
      description: >-
        A per-station ephemeral token supplied through a Compose deployment
        secret. It is never a customer or upstream credential.
  headers:
    MockStationID:
      description: Non-secret identifier of the mock instance that handled the request
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,32}$"
  responses:
    InvalidRequest:
      description: The bounded JSON request is invalid
      headers:
        X-Mock-Station-ID:
          $ref: "#/components/headers/MockStationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidControl:
      description: The control body or requested mode is invalid
      headers:
        X-Mock-Station-ID:
          $ref: "#/components/headers/MockStationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidContentType:
      description: Content-Type is not exactly application/json
      headers:
        X-Mock-Station-ID:
          $ref: "#/components/headers/MockStationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: The control bearer token is absent or invalid
      headers:
        X-Mock-Station-ID:
          $ref: "#/components/headers/MockStationID"
        WWW-Authenticate:
          description: Required HTTP authentication scheme
          required: true
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: The test operator selected unavailable mode
      headers:
        X-Mock-Station-ID:
          $ref: "#/components/headers/MockStationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RequestTooLarge:
      description: The raw request body exceeds the operation byte limit
      headers:
        X-Mock-Station-ID:
          $ref: "#/components/headers/MockStationID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    MockResponse:
      type: object
      additionalProperties: false
      required: [id, object, status, model, output, usage]
      properties:
        id:
          type: string
          const: resp_fixture
        object:
          type: string
          const: response
        status:
          type: string
          const: completed
        model:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        output:
          type: array
          maxItems: 0
        usage:
          type: object
          additionalProperties: false
          required: [input_tokens, output_tokens, total_tokens]
          properties:
            input_tokens:
              type: integer
              const: 1
            output_tokens:
              type: integer
              const: 1
            total_tokens:
              type: integer
              const: 2
    MockSSETranscript:
      type: string
      contentMediaType: text/event-stream
      minLength: 1
      maxLength: 4096
      description: Exactly one response.created frame followed by one response.completed frame.
      x-frame-order: [response.created, response.completed]
      x-data-frame-schemas:
        - {$ref: "#/components/schemas/MockSSECreatedData"}
        - {$ref: "#/components/schemas/MockSSECompletedData"}
    MockSSECreatedData:
      type: object
      additionalProperties: false
      required: [type, sequence_number, response]
      properties:
        type: {type: string, const: response.created}
        sequence_number: {type: integer, const: 1}
        response:
          type: object
          additionalProperties: false
          required: [id, object, status, model]
          properties:
            id: {type: string, const: resp_fixture}
            object: {type: string, const: response}
            status: {type: string, const: in_progress}
            model: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
    MockSSECompletedData:
      type: object
      additionalProperties: false
      required: [type, sequence_number, response]
      properties:
        type: {type: string, const: response.completed}
        sequence_number: {type: integer, const: 2}
        response:
          type: object
          additionalProperties: false
          required: [id, object, status, model, error, usage]
          properties:
            id: {type: string, const: resp_fixture}
            object: {type: string, const: response}
            status: {type: string, const: completed}
            model: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$"}
            error: {type: "null"}
            usage:
              type: object
              additionalProperties: false
              required: [input_tokens, output_tokens, total_tokens]
              properties:
                input_tokens: {type: integer, const: 1}
                output_tokens: {type: integer, const: 1}
                total_tokens: {type: integer, const: 2}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - invalid_content_type
                - request_too_large
                - upstream_unavailable
                - unauthorized
                - invalid_control
                - unexpected_model
            message:
              type: string
              const: mock request failed
    AttemptCapture:
      type: object
      additionalProperties: false
      required: [station_id, total_attempts, authorized_attempts, rejected_attempts, last_attempt]
      properties:
        station_id:
          type: string
          pattern: "^[a-z0-9-]{1,32}$"
        total_attempts: {type: integer, minimum: 0}
        authorized_attempts: {type: integer, minimum: 0}
        rejected_attempts: {type: integer, minimum: 0}
        last_attempt:
          oneOf:
            - {type: "null"}
            - {$ref: "#/components/schemas/AttemptSnapshot"}
    AttemptSnapshot:
      type: object
      additionalProperties: false
      required: [path, stream, credential_valid]
      properties:
        path: {type: string, const: /v1/responses}
        model:
          type: string
          pattern: "^[A-Za-z0-9._:-]{1,128}$"
        stream: {type: boolean}
        credential_valid: {type: boolean}
